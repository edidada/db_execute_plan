name: iceberg-source-lab
on:
  push:
    branches: [main]
    paths: ['upstream/iceberg', '.gitmodules', 'ci/build-iceberg.sh', 'tools/generate_data.py', 'sql/**', 'data/**', '.github/workflows/iceberg.yml', 'tools/iceberg_demo.py', 'ci/iceberg-submodule.init.gradle']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iceberg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only this pinned submodule
        run: git submodule update --init --depth 1 upstream/iceberg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential
          python -m pip install pyspark==3.5.6
      - name: Record environment and generate public-schema data
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/repository-sha.txt
          git -C upstream/iceberg rev-parse HEAD > artifacts/upstream-sha.txt
          uname -a > artifacts/runner.txt
          python tools/generate_data.py | tee artifacts/data-manifest.json
      - name: Build source and run plan experiments
        shell: bash
        run: |
          set -o pipefail
          bash ci/build-iceberg.sh 2>&1 | tee artifacts/build-and-demo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iceberg-plans-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
