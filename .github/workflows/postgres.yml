name: postgres-source-lab
on:
  push:
    branches: [main]
    paths: ['upstream/postgres', '.gitmodules', 'shell_scripts/build-postgres.sh', 'tools/generate_data.py', 'sql/**', 'data/**', '.github/workflows/postgres.yml', 'tools/relational_demo.py', 'plan-audit/**', 'pom.xml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only this pinned submodule
        run: git submodule update --init --depth 1 upstream/postgres
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential bison flex zlib1g-dev libssl-dev
          python -m pip install "psycopg[binary]==3.2.9"
      - name: Record environment and generate public-schema data
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/repository-sha.txt
          git -C upstream/postgres rev-parse HEAD > artifacts/upstream-sha.txt
          uname -a > artifacts/runner.txt
          python tools/generate_data.py | tee artifacts/data-manifest.json
      - name: Build source and run plan experiments
        shell: bash
        run: |
          set -o pipefail
          bash shell_scripts/build-postgres.sh 2>&1 | tee artifacts/build-and-demo.log
      - name: Audit actual PostgreSQL JSON with Java 17
        run: |
          mvn -B -ntp verify
          java -jar plan-audit/target/plan-audit-1.0.0.jar artifacts/pg-*.json > artifacts/pg-cardinality-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-plans-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
