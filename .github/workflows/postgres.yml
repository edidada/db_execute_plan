name: postgres-source-lab
on:
  push:
    branches: [main]
    paths: ['upstream/postgres', '.gitmodules', 'shell_scripts/common.sh', 'shell_scripts/build-postgres.sh', 'tools/generate_data.py', 'sql/workload.sql', 'data/**', '.github/workflows/postgres.yml', 'tools/relational_demo.py', 'plan-audit/**', 'pom.xml', 'shell_scripts/audit-postgres.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run standalone Ubuntu lab
        run: bash shell_scripts/build-postgres.sh --install-deps --jobs 2 --output-dir artifacts
      - name: Audit PostgreSQL plans
        run: bash shell_scripts/audit-postgres.sh --output-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-plans-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
